# Builds VeyAmux-x86_64.AppImage (+ .zsync for automatic updates) on GitHub.
# - Every push to main / pull request: build and keep the AppImage as a workflow artifact (Actions tab).
# - Pushing a tag such as veyamux-v2.1.5-linux15: build and publish a GitHub release with both files attached.
name: VeyAmux AppImage (Linux)

on:
  push:
    branches: [main]
    paths: ['linux/**', '.github/workflows/veyamux-appimage.yml']
    tags: ['veyamux-v*']
  pull_request:
    paths: ['linux/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  SRC: linux      # the VeyAmux (Linux) sources live in linux/

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config patchelf file python3 curl glslang-tools zsync \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-svg-dev qt6-wayland qt6-shader-baker \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-layouts qml6-module-qtqml-workerscript \
            libvulkan-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev libva-dev

      - name: Build AppImage
        working-directory: ${{ env.SRC }}
        env:
          # updates come from this repository's releases
          VEYAMUX_UPDATE_INFO: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|VeyAmux-x86_64.AppImage.zsync
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VeyAmux-x86_64.AppImage
          path: |
            ${{ env.SRC }}/dist/VeyAmux-x86_64.AppImage
            ${{ env.SRC }}/dist/VeyAmux-x86_64.AppImage.zsync

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VeyAmux ${{ github.ref_name }}
          make_latest: true
          # the description: RELEASE_NOTES.md (what is new), then GitHub's generated changelog link
          body_path: ${{ env.SRC }}/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            ${{ env.SRC }}/dist/VeyAmux-x86_64.AppImage
            ${{ env.SRC }}/dist/VeyAmux-x86_64.AppImage.zsync
