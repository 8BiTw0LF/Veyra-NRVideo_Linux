<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- VeyAmux: a V (top) and an A (bottom) meeting in one point - a multiplexer junction where signals join. -->
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa477"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2d4"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff7a45" stop-opacity="0.55"/><stop offset="1" stop-color="#ff7a45" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#12141a"/>
  <circle cx="128" cy="124" r="62" fill="url(#glow)"/>
  <!-- V -->
  <path d="M50 50 L128 124 L206 50" fill="none" stroke="url(#v)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A -->
  <path d="M80 210 L128 124 L176 210" fill="none" stroke="url(#a)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M103 172 L153 172" stroke="#fff4ee" stroke-width="16" stroke-linecap="round"/>
  <!-- junction -->
  <circle cx="128" cy="124" r="11" fill="#12141a" stroke="#ffffff" stroke-width="5"/>
</svg>
